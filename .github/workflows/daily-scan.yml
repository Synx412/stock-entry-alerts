name: Daily market scanner

on:
  workflow_dispatch:
  schedule:
    # India-market scan after NSE close, Monday-Friday.
    - cron: "15 12 * * 1-5"
    # Global-market scan after the US close, Monday-Friday.
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install scanner
        run: pip install -r scanner/requirements.txt

      - name: Scan watchlists and send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python scanner/scanner.py
