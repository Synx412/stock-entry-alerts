name: Trading labs offline smoke test
on:
  pull_request:
    paths:
      - 'trading-lab/**'
      - '.devcontainer/**'
      - '.github/workflows/trading-lab-tests.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install both upstream projects
        run: bash trading-lab/setup.sh
      - name: Run offline tests and simulation
        run: bash trading-lab/test.sh
